name: Release

# Pushing a v* tag builds the release binaries and creates the GitHub release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        # Add more targets here to ship more binaries (e.g. linux-aarch64 on
        # ubuntu-26.04-arm)
        target:
          - name: linux-x86_64
            os: linux
            runs-on: ubuntu-26.04
          - name: windows-x86_64
            os: windows
            runs-on: windows-latest
    runs-on: ${{ matrix.target.runs-on }}

    steps:
    # pinned to the v4.2.2 commit, not the moving v4 tag
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # Pin the compiler by name (C23 needs GCC 14+): build with gcc-15 rather
    # than the image's default gcc, so release binaries stay on a fixed
    # compiler across runner upgrades. The apt install is a no-op while the
    # image already ships gcc-15, but fails loudly if a future image update
    # drops the package or moves the default
    - name: install dependencies (linux)
      if: matrix.target.os == 'linux'
      run: sudo apt-get install -y gcc-15 libgmp-dev

    # MSYS2 UCRT64: GCC supports -std=c23 and ships getopt.h and a static
    # libgmp.a (MSVC is not supported as it lacks C23 <stdckdint.h>)
    - name: set up MSYS2 UCRT64
      if: matrix.target.os == 'windows'
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gmp mingw-w64-ucrt-x86_64-zip make

    - name: build statically linked bundle (linux)
      if: matrix.target.os == 'linux'
      run: |
        # -static: the binary runs on any Linux x86_64, no GMP install needed.
        # make dist stages the binary (named rpn) and examples/ into dist/
        make CC=gcc-15 LDFLAGS='-lgmp -static' dist
        strip dist/rpn
        dist/rpn -V
        dist/rpn -e "3 5 + 7 * p"
        # the archive holds rpn and examples/ at its root
        tar -czf dist/rpn-${{ matrix.target.name }}.tar.gz -C dist rpn examples

    - name: build statically linked bundle (windows)
      if: matrix.target.os == 'windows'
      shell: "msys2 {0}"
      run: |
        # the makefile's OS=Windows_NT path builds a static rpn.exe (single
        # source of truth for the compile flags); it runs on any Windows
        # x86_64, no MinGW/GMP DLLs needed. make dist stages rpn.exe and
        # examples/ into dist/
        make dist
        strip dist/rpn.exe
        ./dist/rpn.exe -V
        ./dist/rpn.exe -e "3 5 + 7 * p"
        # the archive holds rpn.exe and examples/ at its root
        (cd dist && zip -r rpn-${{ matrix.target.name }}.zip rpn.exe examples)

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: rpn-${{ matrix.target.name }}
        path: dist/rpn-${{ matrix.target.name }}*

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
    # pinned to the v4.2.2 commit, not the moving v4 tag
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85 # v4.1.3
      with:
        path: dist
        pattern: rpn-*
        merge-multiple: true

    - name: checksums
      run: |
        cd dist
        sha256sum rpn-* > SHA256SUMS

    - name: create the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag=${GITHUB_REF#refs/tags/}
        gh release create "$tag" dist/rpn-* dist/SHA256SUMS \
          --title "rpn ${tag#v}" \
          --generate-notes
