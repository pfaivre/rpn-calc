name: Release

# Pushing a v* tag builds the release binaries and creates the GitHub release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        # Add more targets here to ship more binaries (e.g. linux-aarch64 on
        # ubuntu-24.04-arm, or a Windows build on a windows runner)
        target:
          - name: linux-x86_64
            runs-on: ubuntu-24.04
    runs-on: ${{ matrix.target.runs-on }}

    steps:
    # pinned to the v4.2.2 commit, not the moving v4 tag
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # ubuntu-24.04 ships GCC 13, which has no -std=c23; C23 needs GCC 14+
    - name: install dependencies
      run: sudo apt-get install -y gcc-14 libgmp-dev

    - name: build statically linked binary
      run: |
        mkdir -p dist
        # -static: the binary runs on any Linux x86_64, no GMP install needed
        gcc-14 -O2 -Wall -pedantic -std=c23 -D_FORTIFY_SOURCE=3 -static \
          -o dist/rpn-${{ matrix.target.name }} src/*.c -lgmp
        strip dist/rpn-${{ matrix.target.name }}
        dist/rpn-${{ matrix.target.name }} -V
        dist/rpn-${{ matrix.target.name }} -e "3 5 + 7 * p"

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: rpn-${{ matrix.target.name }}
        path: dist/rpn-${{ matrix.target.name }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    # pinned to the v4.2.2 commit, not the moving v4 tag
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: actions/download-artifact@87c55149d96e628cc2ef7e6fc2aab372015aec85 # v4.1.3
      with:
        path: dist
        pattern: rpn-*
        merge-multiple: true

    - name: checksums
      run: |
        cd dist
        sha256sum rpn-* > SHA256SUMS

    - name: create the GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        tag=${GITHUB_REF#refs/tags/}
        gh release create "$tag" dist/rpn-* dist/SHA256SUMS \
          --title "rpn ${tag#v}" \
          --generate-notes
