name: Build and test

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # pinned to the v4.2.2 commit, not the moving v4 tag
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    # Pin the compiler by name (C23 needs GCC 14+): test with gcc-15 even when
    # the ubuntu-latest image moves to a new release with a newer default gcc
    - name: install dependencies
      run: sudo apt-get install -y gcc-15 libgmp-dev cppcheck

    - name: make
      run: make CC=gcc-15

    - name: make check
      run: make check

    - name: run tests
      run: make CC=gcc-15 test

  sanitize:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: install dependencies
      run: sudo apt-get install -y gcc-15 libgmp-dev libasan8 libubsan1

    - name: build with address/UB sanitizers
      run: gcc-15 -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -std=c23 -Wall -pedantic -o rpn src/*.c -lgmp

    - name: run tests under sanitizers
      run: |
        ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 bash tests/functional_tests.sh
        ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 bash tests/adversarial_tests.sh

  # Windows build via MSYS2/MinGW-w64: make detects OS=Windows_NT and builds
  # a statically linked rpn.exe (mingw-w64 GCC supports -std=c23 and ships
  # getopt.h and a static libgmp.a; MSVC is not supported as it lacks C23
  # <stdckdint.h>)
  windows:

    runs-on: windows-latest

    defaults:
      run:
        shell: "msys2 {0}"

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gmp make

    - name: make
      run: make

    # dc is not available here, so the dc compliance suite is skipped
    - name: run tests
      run: |
        bash tests/functional_tests.sh
        bash tests/adversarial_tests.sh
